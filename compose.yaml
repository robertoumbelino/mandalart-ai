services:
  postgres:
    image: postgres:17-alpine
    container_name: mandalart-postgres
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_USER: mandalart
      POSTGRES_PASSWORD: mandalart_local_dev
      POSTGRES_DB: mandalart_local
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mandalart -d mandalart_local']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
    name: mandalart-postgres-data
